<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EV424 PDF Preview</title>
  <style>
    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      background: #0b1116;
      color: #111;
      overflow: auto;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      box-sizing: border-box;
    }

    #toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      background: #ffffff;
      border-bottom: 1px solid #d9e2d9;
      color: #111;
    }

    #status {
      font-size: 13px;
      color: #555;
    }

    #openOriginal {
      color: #1b5e20;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    #openOriginal:hover {
      text-decoration: underline;
    }

    #viewerContainer {
      width: 100%;
      height: auto;
      min-height: calc(100vh - 42px);
      overflow-y: auto;
      overflow-x: auto;
      padding: 18px 0 34px;
      background: #0b1116;
    }

    #pages {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .pageWrap {
      width: min(96vw, 1040px);
      background: #ffffff;
      box-shadow: 0 2px 16px rgba(0,0,0,0.35);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #ffffff;
    }

    #error {
      display: none;
      margin: 20px;
      padding: 14px;
      background: #fff4f4;
      border: 1px solid #f0b4b4;
      color: #7a0000;
      border-radius: 10px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <div id="status">Loading PDF...</div>
    <a id="openOriginal" href="#" rel="noopener">Open original PDF</a>
  </div>

  <div id="viewerContainer">
    <div id="error"></div>
    <div id="pages"></div>
  </div>

  <script src="/public_docs/pdfjs/build/pdf.js"></script>
  <script>
    (function () {
      "use strict";

      var params = new URLSearchParams(window.location.search);
      var file = params.get("file");

      var status = document.getElementById("status");
      var openOriginal = document.getElementById("openOriginal");
      var pages = document.getElementById("pages");
      var error = document.getElementById("error");

      function showError(message) {
        error.style.display = "block";
        error.textContent = message;
        status.textContent = "PDF preview error";
      }

      if (!file) {
        showError("Missing PDF file parameter.");
        return;
      }

      openOriginal.href = file;

      if (!window.pdfjsLib) {
        showError("PDF.js library was not loaded.");
        return;
      }

      pdfjsLib.GlobalWorkerOptions.workerSrc = "/public_docs/pdfjs/build/pdf.worker.js";

      function pageTargetWidth() {
        return Math.min(window.innerWidth * 0.96, 1040);
      }

      function renderPage(pdf, pageNumber) {
        return pdf.getPage(pageNumber).then(function (page) {
          var initialViewport = page.getViewport({ scale: 1 });
          var targetWidth = pageTargetWidth();
          var scale = targetWidth / initialViewport.width;
          var viewport = page.getViewport({ scale: scale });

          var wrap = document.createElement("div");
          wrap.className = "pageWrap";

          var canvas = document.createElement("canvas");
          var context = canvas.getContext("2d", { alpha: false });

          var outputScale = window.devicePixelRatio || 1;

          canvas.width = Math.floor(viewport.width * outputScale);
          canvas.height = Math.floor(viewport.height * outputScale);
          canvas.style.width = Math.floor(viewport.width) + "px";
          canvas.style.height = Math.floor(viewport.height) + "px";

          context.setTransform(outputScale, 0, 0, outputScale, 0, 0);

          wrap.appendChild(canvas);
          pages.appendChild(wrap);

          return page.render({
            canvasContext: context,
            viewport: viewport
          }).promise;
        });
      }

      pdfjsLib.getDocument(file).promise.then(function (pdf) {
        status.textContent = "Loading " + pdf.numPages + " page(s)...";

        var chain = Promise.resolve();

        for (var i = 1; i <= pdf.numPages; i += 1) {
          (function (pageNumber) {
            chain = chain.then(function () {
              status.textContent = "Rendering page " + pageNumber + " / " + pdf.numPages;
              return renderPage(pdf, pageNumber);
            });
          })(i);
        }

        return chain.then(function () {
          status.textContent = "Preview ready · " + pdf.numPages + " page(s)";
        });
      }).catch(function (err) {
        showError(String(err && err.message ? err.message : err));
      });
    })();
  </script>
</body>
</html>
