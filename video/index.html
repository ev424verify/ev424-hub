<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EV424 — Video Passport Index</title>
<style>
:root{--bg:#0b1220;--panel:#111a2b;--line:#31415f;--text:#e8eefc;--muted:#aab7d4;--green:#36d37a;--blue:#57a6ff}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 20% 0%,#14213a,#0b1220 45%,#070b13);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:980px;margin:22px auto;padding:0 14px}
.top{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:rgba(17,26,43,.82)}
.dot{width:10px;height:10px;border-radius:999px;background:var(--green);display:inline-block;margin-right:8px}
.panel{margin-top:18px;border:1px solid var(--line);border-radius:18px;padding:18px;background:rgba(17,26,43,.82)}
h1{font-size:clamp(28px,8vw,40px);line-height:1.08;margin:0 0 14px}
.muted{color:var(--muted);font-size:13px}
.searchbar{display:grid;grid-template-columns:1fr auto;gap:10px;margin:16px 0 10px}
input{width:100%;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.04);color:var(--text);padding:13px 14px;font:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid rgba(54,211,122,.9);border-radius:12px;padding:11px 14px;color:var(--text);text-decoration:none;font-weight:800;background:rgba(255,255,255,.03);min-height:44px}
.btn.blue{border-color:rgba(87,166,255,.8);background:linear-gradient(180deg,#55b7ff,#168cff);color:#06101f}
.btn.small{min-height:40px;padding:9px 13px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 2px}
.cards{display:grid;gap:12px;margin-top:14px}
.vcard{border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.035);padding:14px}
.k{color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin-bottom:3px}
.v{font-weight:800;overflow-wrap:anywhere}
.url a{color:var(--blue);font-weight:800;overflow-wrap:anywhere}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.receipt{white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#07101e;border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px;overflow-x:auto;font-size:12px}
.notice{border:1px solid var(--line);border-radius:14px;padding:12px;background:rgba(255,255,255,.025);margin-top:12px}
@media (min-width:760px){
  .entrygrid{display:grid;grid-template-columns:100px 1.6fr 2.2fr;gap:12px;align-items:start}
  .actions{grid-template-columns:auto auto;justify-content:end}
}
@media (max-width:520px){
  .wrap{padding:0 10px;margin:14px auto}
  .panel{padding:14px}
  .top{padding:12px}
  .searchbar{grid-template-columns:1fr}
  .btnrow .btn{flex:1 1 auto}
}
</style>
</head>
<body>
<main class="wrap">
  <div class="top"><div><span class="dot"></span><b>EV424 Video Passport</b></div><a class="btn" href="/">Back</a></div>
  <section class="panel">
    <h1>Video Passport Index</h1>
    <p class="muted">Independent video-passport public index. Search exact video entry ID or 64-hex projection SHA-256. URL opens the exact official video page. Open shows the video-specific receipt. JSON opens the public projection JSON.</p>
    <div class="searchbar">
      <input id="q" placeholder="EV424-VIDEO-ENTRY-000001 or 64-hex projection sha256">
      <button id="check" class="btn blue" type="button">Check Evidence</button>
    </div>
    <div class="btnrow">
      <button class="btn small" type="button" onclick="location.reload()">Reload</button>
      <a class="btn blue small" href="/public_data/video_weekly_index.json" target="_blank" rel="noopener">WEEK</a>
      <a class="btn small" href="/">Back</a>
    </div>
    <div id="app">Loading...</div>
  </section>
</main>
<script>
const INDEX_URL="/public_data/video_index.json";
function esc(s){return String(s ?? "").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));}
function receipt(e){
 const rv=e.revalidation||{};
 return `==[EV424 VIDEO FINAL RECEIPT]==

01)
LEGEND
PASS/HOLD    Video-passport public projection status
MODE         VIDEO_READ_ONLY_NON_CUSTODY
----------------------------------------

02)
IDENTITY
VIDEO_ENTRY  ${e.video_entry_id}
DATE         ${e.date}
URL          ${e.url_href_exact}
LABEL        ${e.url_display_label}
REVERIFY     ${rv.reverify || "+7d -> VIDEO_PAGE_CONSISTENCY + PUBLIC_PROJECTION_SHA"}
----------------------------------------

03)
VERIFY
STATUS       PUBLIC_PROJECTION_SHA | VIDEO_INDEX_SHA | EXACT_URL_LINK
BOUNDARY     NO_RAW_HTML_PUBLICATION | NO_MANIFEST_MEDIA_SEGMENT | NO_ORIGINAL_VIDEO_BYTES
----------------------------------------

04)
RESULT
${e.projection_sha256 ? "PASS | projection_sha256=" + e.projection_sha256 : "HOLD | projection_sha256=missing"}

Revalidation
HISTORY_N ${rv.history_n ?? 0}
TIMELINE ${Array.isArray(rv.timeline)&&rv.timeline.length ? rv.timeline.join("\n") : "[]"}
LAST_STATUS ${rv.last_status || "BASELINE_NO_REVALIDATION_YET"}

Accuracy(4)=Truth(2)=Life(4)`;
}
function findEntry(entries,q){
 const x=String(q||"").trim();
 if(!x)return null;
 return entries.find(e=>e.video_entry_id===x || e.projection_sha256===x) || null;
}
function card(e){
 return `<article class="vcard">
  <div class="entrygrid">
    <div><div class="k">DATE</div><div class="v">${esc(e.date)}</div></div>
    <div><div class="k">VIDEO ENTRY</div><div class="v">${esc(e.video_entry_id)}</div><div class="muted">${esc(e.revalidation?.last_status||"")}</div></div>
    <div class="url"><div class="k">URL</div><a href="${esc(e.url_href_exact)}" target="_blank" rel="noopener">${esc(e.url_display_label)}</a></div>
  </div>
  <div class="actions">
    <a class="btn" href="${esc(e.open_target)}">Open</a>
    <a class="btn" href="${esc(e.json_target)}" target="_blank" rel="noopener">JSON</a>
  </div>
 </article>`;
}
function renderIndex(entries){
 document.getElementById("app").innerHTML=`<div class="cards">${entries.map(card).join("")}</div>`;
}
function renderReceipt(e){
 document.getElementById("app").innerHTML=`<p><a class="btn" href="/video/">Back to Video Index</a> <a class="btn" href="${esc(e.json_target)}" target="_blank" rel="noopener">JSON</a></p><div class="receipt">${esc(receipt(e))}</div>`;
}
fetch(INDEX_URL,{cache:"no-store"}).then(r=>r.json()).then(data=>{
 const entries=data.entries||[];
 const params=new URLSearchParams(location.search);
 const q=params.get("q")||"";
 document.getElementById("q").value=q;
 const found=findEntry(entries,q);
 if(q && found){renderReceipt(found);} else if(q && !found){document.getElementById("app").innerHTML='<div class="notice">NO EXACT MATCH</div>';} else {renderIndex(entries);}
 document.getElementById("check").onclick=()=>{const v=document.getElementById("q").value.trim(); if(v) location.href="/video/?q="+encodeURIComponent(v);};
 document.getElementById("q").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("check").click();});
}).catch(err=>{document.getElementById("app").textContent="LOAD_FAIL: "+err;});
</script>
</body>
</html>
